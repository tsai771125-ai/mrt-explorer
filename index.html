<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>台北捷運探索 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:#1C1C1C;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:#1C1C1C;height:46px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{color:#F8F7F5;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo em{color:#F5C842;font-style:normal}
.hint{color:#555;font-size:11px}
/* 官方地圖容器 */
.map-wrap{flex:1;overflow:auto;background:#e8e4e0;display:flex;align-items:flex-start;justify-content:center;padding:8px}
#map-container{position:relative;width:900px;height:900px;flex-shrink:0}
#map-img{width:900px;height:900px;display:block;user-select:none;-webkit-user-drag:none}
/* 站點熱區 */
.stn{position:absolute;width:22px;height:22px;border-radius:50%;cursor:pointer;
  transform:translate(-50%,-50%);background:transparent;border:2px solid transparent;
  z-index:5;transition:background .1s,border-color .1s,box-shadow .1s}
.stn:hover{background:rgba(255,230,0,.22);border-color:rgba(255,200,0,.8)}
.stn.active{background:rgba(255,220,0,.28);border-color:rgba(255,160,0,.9);
  box-shadow:0 0 10px rgba(255,200,0,.55)}
@keyframes stnPing{
  0%{box-shadow:0 0 0 0 rgba(255,200,0,.75)}
  100%{box-shadow:0 0 0 20px rgba(255,200,0,0)}
}
/* SVG 列車：83×18px，transform-origin = 車身中央 (41px 9px) */
#train{position:absolute;left:0;top:0;overflow:visible;
  pointer-events:none;z-index:10;transform-origin:41px 9px;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
/* 三鶯線 2026 banner */
#lb-banner{background:#182535;border-top:1px solid #253a52;padding:3px 14px;
  flex-shrink:0;display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap}
.lb-title{color:#00BFFF;font-size:11px;font-weight:700;flex-shrink:0}
.lb-stn{background:#0e1e2e;border:1px solid rgba(0,191,255,.4);color:#7dd6f0;
  border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;flex-shrink:0}
.lb-stn:hover{background:#1a3a55;color:#fff}
/* 右側資訊面板 */
#panel{position:fixed;top:46px;right:-375px;width:365px;height:calc(100vh - 46px);
  background:#fff;border-left:1px solid #ddd;display:flex;flex-direction:column;
  transition:right .3s cubic-bezier(.4,0,.2,1);z-index:300;box-shadow:-4px 0 18px rgba(0,0,0,.15)}
#panel.open{right:0}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:10px;color:#ccc;font-size:13px;text-align:center;padding:24px}
.p-head{padding:16px 18px 12px;border-bottom:1px solid #eee;flex-shrink:0;position:relative}
.cls{position:absolute;top:13px;right:13px;width:26px;height:26px;border:none;
  background:#f0f0f0;border-radius:50%;cursor:pointer;font-size:14px;line-height:26px;text-align:center}
.cls:hover{background:#e0e0e0}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;color:#fff;margin-bottom:6px}
.pn{font-size:22px;font-weight:700;line-height:1.2}
.pe{font-size:11px;color:#999;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:10px 18px;border-bottom:1px solid #eee;flex-shrink:0}
.tag{background:#FDF0E4;color:#C27A3A;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700}
.scr{flex:1;overflow-y:auto}
.sec{padding:12px 18px;border-bottom:1px solid #f5f5f5}
.st{font-size:10px;font-weight:700;color:#aaa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.intro{font-size:13px;line-height:1.85;color:#222}
.hl{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid #fafafa}
.hl:last-child{border:none}
.hi{width:27px;height:27px;border-radius:7px;background:#FDF0E4;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.hn{font-size:12px;font-weight:700}.hd{font-size:11px;color:#999;margin-top:1px;line-height:1.5}
.ai{padding:12px 14px;border-top:1px solid #eee;background:#F8F7F5;flex-shrink:0}
.at{font-size:10px;font-weight:700;color:#aaa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.qrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.qb{background:#fff;border:1px solid #e0e0e0;border-radius:5px;padding:4px 9px;font-size:11px;
  font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .12s}
.qb:hover{border-color:#C27A3A;color:#C27A3A;background:#FDF0E4}
.ar{display:flex;gap:5px}
.ai-in{flex:1;border:1px solid #e0e0e0;border-radius:5px;padding:7px 10px;font-size:12px;
  font-family:'Noto Sans TC',sans-serif;outline:none}
.ai-in:focus{border-color:#C27A3A}
.ai-go{background:#C27A3A;color:#fff;border:none;border-radius:5px;padding:7px 12px;font-size:12px;cursor:pointer;font-weight:700}
</style>
</head>

    <svg id="train" viewBox="-83 -9 83 18" width="83" height="18">

// BFS 最短路徑
function buildAdj(){
  const a={};
  const add=(x,y)=>{
    [x,y].forEach(n=>{if(!a[n])a[n]=new Set();});
    a[x].add(y);a[y].add(x);
    const ax=ALIAS[x],ay=ALIAS[y];
    if(ax){if(!a[ax])a[ax]=new Set();a[ax].add(y);a[y].add(ax);}
    if(ay){if(!a[ay])a[ay]=new Set();a[x].add(ay);a[ay].add(x);}
    if(ax&&ay){a[ax].add(ay);a[ay].add(ax);}
  };
  Object.values(LINES).forEach(l=>{for(let i=0;i<l.length-1;i++)add(l[i],l[i+1]);});
  Object.entries(ALIAS).forEach(([x,y])=>{
    [x,y].forEach(n=>{if(!a[n])a[n]=new Set();});
    a[x].add(y);a[y].add(x);
  });
  return a;
}
const ADJ=buildAdj();
function bfs(f,t){
  const fn=ALIAS[f]||f,tn=ALIAS[t]||t;
  if(fn===tn)return[fn];
  const Q=[[fn,[fn]]],v=new Set([fn]);
  while(Q.length){
    const[n,p]=Q.shift();
    for(const nb of(ADJ[n]||new Set())){
      if(v.has(nb))continue;v.add(nb);
      const np=[...p,nb];
      if(nb===tn||nb===t)return np;
      Q.push([nb,np]);
    }
  }
  return[fn,tn];
}

// ── 🍋 列車狀態 ──
let tx=293,ty=488,ta=0;
let wps=[],wi=0,pending=null;
let isIdle=true,idleTimer=null;
const TOUR=['R28','R22A','R16','BL12','BL07','BL23','BR01','G01','G19','O54','O21','R02','Y16','BR20'];
let ti=0;
const SPD=1.5;

function posC(){
  // 車身中央 (元素內 41px,9px) 對齊站點座標 (tx,ty)
  document.getElementById('train').style.transform=
    `translate(${tx-41}px,${ty-9}px) rotate(${ta}deg)`;
}

function tick(){
  if(!wps.length||wi>=wps.length){
    if(pending){const id=pending;pending=null;ping();setTimeout(()=>openP(id),280);}
    if(isIdle&&!idleTimer)idleTimer=setTimeout(nextIdle,3000+Math.random()*2000);
    return;
  }
  const[wx,wy]=wps[wi];
  const dx=wx-tx,dy=wy-ty,d=Math.hypot(dx,dy);
  if(d<SPD+0.3){tx=wx;ty=wy;wi++;}
  else{tx+=dx/d*SPD;ty+=dy/d*SPD;ta=Math.atan2(dy,dx)*180/Math.PI;}
  posC();
}

function ping(){
  const el=document.getElementById('s-'+(cur||''));
  if(!el)return;
  el.style.animation='none';
  requestAnimationFrame(()=>{
    el.style.animation='stnPing .65s ease-out';
    setTimeout(()=>el.style.animation='',700);
  });
}

function route(to){
  let best=null,bd=Infinity;
  for(const[id,[x,y]]of Object.entries(P)){
    const d=Math.hypot(tx-x,ty-y);
    if(d<bd){bd=d;best=id;}
  }
  const path=bfs(best,to);
  wps=path.map(id=>{const pos=P[id]||P[ALIAS[id]];return pos||[tx,ty];});
  wi=0;
}

function nextIdle(){
  idleTimer=null;if(!isIdle)return;
  ti=(ti+1)%TOUR.length;route(TOUR[ti]);
  idleTimer=setTimeout(nextIdle,4000+Math.random()*3000);
}

// ── 站點互動 ──
let cur=null;
function S(id){
  if(cur)document.getElementById('s-'+cur)?.classList.remove('active');
  const disp=ALIAS[id]||id;cur=disp;
  document.getElementById('s-'+disp)?.classList.add('active');
  isIdle=false;if(idleTimer){clearTimeout(idleTimer);idleTimer=null;}
  route(id);pending=id;
}

function openP(id){
  const d=DB[id]||DB[ALIAS[id]];
  const line=(d?.l)||id.replace(/\d.*/,'');
  const name=d?.n||SN[id]||SN[ALIAS[id]]||id;
  document.getElementById('ph').style.display='none';
  document.getElementById('pDet').style.display='flex';
  document.getElementById('pBadge').textContent=LN[line]||line;
  document.getElementById('pBadge').style.background=LC[line]||'#888';
  document.getElementById('pName').textContent=name;
  document.getElementById('pEn').textContent=d?.e||'';
  document.getElementById('pTags').innerHTML=(d?.t||[]).map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('pIntro').textContent=d?.i||FB[line]||'站點資料整理中…';
  document.getElementById('pHL').innerHTML=(d?.h||[]).length
    ?d.h.map(h=>`<div class="hl"><div class="hi">${h.i}</div><div><div class="hn">${h.n}</div><div class="hd">${h.d}</div></div></div>`).join('')
    :'<p style="font-size:12px;color:#ccc">AI 將為此站整理熱門景點…</p>';
  document.getElementById('aiIn').placeholder='幫我找'+name+'附近的…';
  document.getElementById('panel').classList.add('open');
}

function closeP(){
  document.getElementById('panel').classList.remove('open');
  if(cur){document.getElementById('s-'+cur)?.classList.remove('active');cur=null;}
  isIdle=true;idleTimer=setTimeout(nextIdle,2000);
}

function qa(q){document.getElementById('aiIn').value=document.getElementById('pName').textContent+'附近的'+q;}
function sendAI(){
  const v=document.getElementById('aiIn').value.trim();
  if(!v)return;
  alert('🤖 Gemini AI 搜尋：「'+v+'」\n\n（串接 Gemini Search Grounding API 後即時顯示結果）');
}

  const mc=document.getElementById('map-container');

    mc.appendChild(div);

})();
